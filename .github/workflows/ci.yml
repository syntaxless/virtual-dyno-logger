name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Core tests
        run: swift test --package-path Core
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen
      - name: Build app (simulator, unsigned)
        run: >
          xcodebuild -project DynoLogger.xcodeproj -scheme DynoLogger
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  screenshots:
    # The App Store screenshots in screenshot mode, so the look can be checked from a PR. Download them from the run's
    # artifacts. The final store screenshots are taken with the same script on a Mac.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Screenshots (iPhone 16 Pro Max)
        run: tools/screenshots.sh
      - name: Thumbnails in the log (temporary, for checking from a sandbox that cannot download artifacts)
        run: |
          for f in screenshots/*/*.png; do
            sips -s format jpeg -s formatOptions 60 -Z 900 "$f" --out /tmp/t.jpg >/dev/null
            echo "THUMB $(basename "$f") $(base64 -i /tmp/t.jpg | tr -d '\n')"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
  dyno-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: syntaxless/virtual-dyno
          path: virtual-dyno
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: App output loads in the Virtual Dyno
        run: python tools/check_dyno.py virtual-dyno
