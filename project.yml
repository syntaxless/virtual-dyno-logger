# XcodeGen spec: `brew install xcodegen && xcodegen` writes DynoLogger.xcodeproj (not committed).
name: DynoLogger
options:
  bundleIdPrefix: co.turboloser
  deploymentTarget:
    iOS: "17.0"
packages:
  DynoLoggerCore:
    path: Core
targets:
  DynoLogger:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: DynoLoggerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.turboloser.dynologger
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dyno Logger
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Connects to your OBD-II adapter, GPS receiver and GoPro to record runs.
        NSLocationWhenInUseUsageDescription: Records your GPS track so the Virtual Dyno can work out heading, grade and weather.
        NSLocationAlwaysAndWhenInUseUsageDescription: Keeps recording the GPS track while the screen is off during a run.
        UIBackgroundModes: [bluetooth-central, location]
        # Sessions show up in the Files app under "On My iPhone > Dyno Logger", where Safari's file picker can reach them.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
