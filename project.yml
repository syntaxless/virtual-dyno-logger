# XcodeGen spec: `brew install xcodegen && xcodegen` writes DynoLogger.xcodeproj (not committed).
name: DynoLogger
options:
  bundleIdPrefix: com.itschefff
  deploymentTarget:
    iOS: "17.0"
packages:
  DynoLoggerCore:
    path: Core
targets:
  DynoLogger:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/PrivacyInfo.xcprivacy"]
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: DynoLoggerCore
    settings:
      base:
        # Apple Developer Team ID (developer.apple.com > Account > Membership details). It lives here rather than in
        # Xcode's Signing tab because running xcodegen again rewrites the project and would lose it.
        DEVELOPMENT_TEAM: 2UC3PX4SQS
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.itschefff.virtualdynologger
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dyno Logger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64, bluetooth-le]
        UIAppFonts: [VT323-Regular.ttf]
        NSBluetoothAlwaysUsageDescription: >-
          Dyno Logger connects over Bluetooth to your OBD-II adapter, GPS receiver (such as a RaceBox) and GoPro to
          record engine data, a GPS track and video during a run.
        NSLocationWhenInUseUsageDescription: >-
          Dyno Logger records your location and speed during a run, including while the screen is locked, and saves
          them in the run's GPX file so the Virtual Dyno can work out heading, road grade and weather. The track stays
          on your iPhone unless you share it.
        UIBackgroundModes: [bluetooth-central, location]
        # Sessions show up in the Files app under "On My iPhone > Dyno Logger", where Safari's file picker can reach them.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
